<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>视频观看问卷</title>
<script src="config.js"></script>
<style>
  :root{
    --bg: #0b0b0c;
    --ink: #f5f5f3;
    --ink-dim: #9a9a96;
    --accent: #e8463a;
    --card: #161617;
    --line: rgba(255,255,255,0.12);
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app{ min-height:100vh; display:flex; flex-direction:column; align-items:center; }

  /* ---------- intro / screening ---------- */
  .screen{
    width:100%; max-width:480px; min-height:100vh;
    display:flex; flex-direction:column; justify-content:center;
    padding: 32px 24px; gap:18px;
  }
  .eyebrow{ color:var(--accent); font-size:13px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin:0; }
  h1{ font-size:28px; line-height:1.25; margin:0 0 4px; font-weight:700; }
  p.lead{ color:var(--ink-dim); font-size:15px; line-height:1.6; margin:0 0 8px; }
  .btn, a.btn{
    background: var(--accent); color:#fff; border:none; border-radius:999px;
    padding:14px 22px; font-size:16px; font-weight:600; cursor:pointer;
    width:100%; margin-top:8px; transition: opacity .15s;
    display:block; text-align:center; text-decoration:none; box-sizing:border-box;
  }
  .btn:active{ opacity:0.8; }
  .btn.secondary{
    background:transparent; color:var(--ink); border:1px solid var(--line);
  }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }

  .field{ display:flex; flex-direction:column; gap:8px; }
  .field label{ font-size:14px; color:var(--ink-dim); }
  .field input[type=number], .field input[type=text], .field textarea{
    background: var(--card); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); padding:12px 14px; font-size:16px; width:100%; font-family:inherit;
  }
  .field textarea{ min-height:90px; resize:vertical; }
  .choice-row{ display:flex; flex-direction:column; gap:8px; }
  .choice-btn{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); padding:13px 14px; font-size:15px; text-align:left; cursor:pointer;
  }
  .choice-btn.selected{ border-color: var(--accent); background: rgba(232,70,58,0.12); }
  .scale-row{ display:flex; gap:8px; justify-content:space-between; }
  .scale-pt{
    flex:1; aspect-ratio:1; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:15px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .scale-pt.selected{ border-color:var(--accent); background:var(--accent); }
  .scale-labels{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-dim); margin-top:-6px; }
  .audio-block{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:18px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px;
  }
  .audio-play-btn{
    width:56px; height:56px; border-radius:50%; background:var(--accent); border:none;
    color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .audio-hint{ font-size:12px; color:var(--ink-dim); }
  .audio-replay-count{ font-size:12px; color:var(--ink-dim); }
  .progress-dots{ display:flex; gap:6px; justify-content:center; margin-bottom:4px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--line); }
  .dot.active{ background:var(--accent); }

  /* ---------- feed (vertical video scroll) ---------- */
  #feed-screen{ width:100%; height:100vh; position:relative; background:#000; }
  .feed-scroller{
    height:100vh; width:100%; overflow-y:scroll; scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
  }
  .feed-item{
    height:100vh; width:100%; scroll-snap-align:start; position:relative;
    display:flex; align-items:center; justify-content:center; background:#000; overflow:hidden;
  }
  .feed-item .backdrop{
    position:absolute; inset:0; background-size:cover; background-position:center;
    filter:blur(30px) brightness(0.45); transform:scale(1.15);
  }
  .feed-item video{
    position:relative; z-index:1;
    width:100%; height:100%; object-fit:contain;
  }
  .feed-meta{
    position:absolute; left:0; bottom:0; right:72px;
    padding:14px 14px 32px 14px;
    background:linear-gradient(transparent, rgba(0,0,0,0.72));
    display:flex; flex-direction:column; gap:5px; pointer-events:none; z-index:3;
  }
  .feed-handle{
    font-weight:700; font-size:15px; display:flex; align-items:center; gap:6px;
  }
  .feed-handle-at{ color:#fff; }
  .feed-caption{
    font-size:13px; color:#eee; line-height:1.45; max-height:60px;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  }
  .feed-music{
    font-size:12px; color:#ddd; margin-top:2px;
    display:flex; align-items:center; gap:5px;
  }
  .feed-music-note{ animation:spin 4s linear infinite; display:inline-block; }
  /* right-side rail: avatar + actions stacked */
  .feed-rail{
    position:absolute; right:10px; bottom:80px;
    display:flex; flex-direction:column; align-items:center; gap:18px; z-index:3;
  }
  .feed-avatar{
    width:44px; height:44px; border-radius:50%; border:2px solid #fff;
    background:var(--accent); display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:700; color:#fff; overflow:hidden; flex-shrink:0;
  }
  .feed-actions{
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .feed-action{
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .feed-action-icon{
    width:44px; height:44px; border-radius:50%; background:rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    cursor:pointer; transition: transform .1s;
  }
  .feed-action-icon:active{ transform:scale(0.88); }
  .feed-action-icon.liked{ animation: heart-pop .25s ease; }
  @keyframes heart-pop{
    0%  { transform:scale(1); }
    50% { transform:scale(1.35); }
    100%{ transform:scale(1); }
  }
  .feed-action-count{ font-size:12px; font-weight:600; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.7); }
  .feed-progress{
    position:absolute; top:10px; left:10px; right:10px; display:flex; gap:4px; z-index:5;
  }
  .feed-progress .seg{ flex:1; height:2.5px; border-radius:2px; background:rgba(255,255,255,0.3); }
  .feed-progress .seg.done{ background:#fff; }
  .sound-icon{
    position:absolute; top:14px; right:14px; z-index:5;
    width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center; font-size:15px; pointer-events:none;
  }
  /* comments drawer — slides up from bottom */
  .comments-drawer{
    position:absolute; left:0; right:0; bottom:0; z-index:10;
    background:rgba(22,22,23,0.97); border-radius:16px 16px 0 0;
    padding:16px 16px 32px; max-height:55vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .28s ease;
  }
  .comments-drawer.open{ transform:translateY(0); }
  .comments-drawer-handle{
    width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,0.25);
    margin:0 auto 14px;
  }
  .comments-drawer-title{
    font-size:15px; font-weight:700; margin-bottom:14px; color:var(--ink);
  }
  .comment-row{
    display:flex; gap:10px; margin-bottom:14px; align-items:flex-start;
  }
  .comment-avatar{
    width:32px; height:32px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; flex-shrink:0;
  }
  .comment-body{ flex:1; }
  .comment-handle{ font-size:12px; color:var(--ink-dim); margin-bottom:2px; }
  .comment-text{ font-size:14px; line-height:1.5; color:var(--ink); }
  /* volume slider */
  .volume-bar{
    position:absolute; left:14px; bottom:140px; z-index:6;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .volume-icon{ font-size:16px; }
  .volume-slider{
    -webkit-appearance:none; appearance:none;
    writing-mode:vertical-lr; direction:rtl;
    width:4px; height:80px; border-radius:2px;
    background:rgba(255,255,255,0.3); outline:none; cursor:pointer;
  }
  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px;
    border-radius:50%; background:#fff; cursor:pointer;
  }
  /* back button */
  .feed-back-btn{
    position:absolute; top:20px; left:14px; z-index:6;
    width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,0.45);
    border:none; color:#fff; font-size:16px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; display:none;
  }
  .feed-back-btn.show{ display:flex; }
  .share-toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:rgba(30,30,30,0.95); color:#fff; padding:10px 18px;
    border-radius:999px; font-size:13px; font-weight:600; z-index:30;
    opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap;
  }
  .share-toast.show{ opacity:1; }
  .sound-overlay{
    position:absolute; inset:0; z-index:20; background:rgba(0,0,0,0.55);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .sound-overlay.hidden{ display:none; }
  .sound-overlay-inner{
    background:rgba(20,20,20,0.9); border:1px solid var(--line); border-radius:16px;
    padding:24px 28px; display:flex; flex-direction:column; align-items:center; gap:10px;
    color:#fff; font-size:15px; font-weight:600; text-align:center;
  }
  .sound-overlay-icon{ font-size:30px; }
  .feed-continue{
    position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
    background:#fff; color:#000; border:none; border-radius:999px; padding:12px 20px;
    font-size:14px; font-weight:600; z-index:25; display:none;
  }
  .feed-continue.show{ display:block; }

  /* ---------- survey ---------- */
  .survey-wrap{ width:100%; max-width:520px; padding:28px 24px 60px; }
  .q-block{ margin-bottom:30px; padding-bottom:26px; border-bottom:1px solid var(--line); }
  .q-block:last-of-type{ border-bottom:none; }
  .q-prompt{ font-size:16px; font-weight:600; margin:0 0 14px; line-height:1.5; }
  .section-title{ font-size:13px; text-transform:uppercase; letter-spacing:0.05em; color:var(--accent); font-weight:700; margin: 8px 0 4px; }
  /* video picker cards */
  .video-pick-list{ display:flex; flex-direction:column; gap:10px; }
  .video-pick-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--card); border:2px solid var(--line); border-radius:12px;
    padding:12px 14px; cursor:pointer; transition:border-color .15s;
  }
  .video-pick-card.selected{ border-color:var(--accent); background:rgba(232,70,58,0.1); }
  .vpc-left{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .vpc-thumb{
    width:42px; height:42px; border-radius:8px; background:var(--accent); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:#fff;
  }
  .vpc-info{ flex:1; min-width:0; }
  .vpc-handle{ font-size:13px; font-weight:700; color:var(--ink); }
  .vpc-caption{ font-size:12px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vpc-rewatch{
    background:transparent; border:1px solid var(--line); border-radius:999px;
    color:var(--ink-dim); font-size:12px; padding:5px 12px; cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .vpc-rewatch:hover{ border-color:var(--accent); color:var(--accent); }
  /* rewatch modal */
  .rewatch-modal{
    position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.88);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .rewatch-modal.open{ opacity:1; pointer-events:all; }
  .rewatch-inner{ width:min(400px,92vw); display:flex; flex-direction:column; gap:12px; }
  .rewatch-close{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font-size:14px; padding:10px 20px; cursor:pointer; align-self:center;
  }
  .done-screen{ text-align:center; padding-top:80px; }
  .spinner{
    width:28px; height:28px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin 0.8s linear infinite; margin: 0 auto;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .err{ color:#ff8a80; font-size:13px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

  // ---------------- state ----------------
  const state = {
    participantId: 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36),
    screen: 'intro',           // intro -> screening -> feedIntro -> feed -> survey -> done
    screeningAnswers: {},
    screeningIndex: 0,
    feedList: [],              // ordered list of {src, isTarget, targetId}
    feedIndex: 0,
    targetMeta: null,          // {id, slot}
    watchedAll: false,
    likedVideos: new Set(),    // stems of videos the participant liked
    surveyAnswers: {},
    surveySection: 0,
    surveyQIndex: 0,
    downloadUrl: null,
    downloadFilename: null,
  };

  const app = document.getElementById('app');

  // ---------------- helpers ----------------
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
  function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

  function buildFeed(){
    const cfg = CONFIG;
    const targetCount = Math.max(1, cfg.targetVideoCount || 1);
    const size        = Math.max(targetCount, cfg.feedSize || 5);

    // separate videos that have audio questions from those that don't
    const withAudio    = cfg.targetVideos.filter(v => cfg.targetAudioQuestions && cfg.targetAudioQuestions[v.id]);
    const withoutAudio = cfg.targetVideos.filter(v => !cfg.targetAudioQuestions || !cfg.targetAudioQuestions[v.id]);

    function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; } return a; }

    // pick `targetCount` study-target videos (prefer those with audio questions)
    const shuffledWithAudio    = shuffle(withAudio);
    const shuffledWithoutAudio = shuffle(withoutAudio);
    const studyTargets = [
      ...shuffledWithAudio.slice(0, targetCount),
      ...shuffledWithoutAudio.slice(0, Math.max(0, targetCount - shuffledWithAudio.length)),
    ].slice(0, targetCount);

    const studyIds = new Set(studyTargets.map(v => v.id));

    // fill the rest of the feed from non-study-target videos
    const fillers = shuffle(cfg.targetVideos.filter(v => !studyIds.has(v.id))).slice(0, size - targetCount);

    // combine and shuffle positions
    const combined = shuffle([...studyTargets, ...fillers]);

    const list = combined.map(v => ({
      src:      v.file,
      isTarget: studyIds.has(v.id),
      targetId: v.id,
      meta:     v,
    }));

    state.feedList   = list;
    // record the first study target for backward compat (survey sections use this)
    state.targetMeta = { id: studyTargets[0].id, slot: list.findIndex(i => i.targetId === studyTargets[0].id) + 1 };
    state.studyTargetIds = Array.from(studyIds);
  }

  function saveResponse(){
    const payload = {
      participantId: state.participantId,
      submittedAt: new Date().toISOString(),
      targetVideoId: state.targetMeta.id,
      targetSlot: state.targetMeta.slot,
      allStudyTargets: state.studyTargetIds || [state.targetMeta.id],
      feedSize: state.feedList.length,
      likedVideos: Array.from(state.likedVideos),
      likedTarget: state.likedVideos.has(state.targetMeta.id),
      participantGroup: state.screeningAnswers['wenzhounese_identity'] === '是' ? 'wenzhounese' : 'non-wenzhounese',
      screening: state.screeningAnswers,
      survey: state.surveyAnswers,
    };

    const json     = JSON.stringify(payload, null, 2);
    const blob     = new Blob([json], { type: 'application/json' });
    const url      = URL.createObjectURL(blob);
    const filename = `response_${state.participantId}.json`;

    // store on state so the done screen can re-trigger the download
    state.downloadUrl      = url;
    state.downloadFilename = filename;
    return { url, filename };
  }

  // ---------------- render ----------------
  function render(){
    if(state.screen === 'intro') return renderIntro();
    if(state.screen === 'screening') return renderScreening();
    if(state.screen === 'feedIntro') return renderFeedIntro();
    if(state.screen === 'feed') return renderFeed();
    if(state.screen === 'survey') return renderSurvey();
    if(state.screen === 'done') return renderDone();
  }

  function screenWrap(innerHtml){
    app.innerHTML = `<div class="screen">${innerHtml}</div>`;
  }

  function renderIntro(){
    screenWrap(`
      <p class="eyebrow">研究问卷</p>
      <h1>观看几个短视频，然后回答几个问题</h1>
      <p class="lead">您将观看一组短视频，类似于刷视频动态。观看完毕后，我们会请您回答一些相关问题。整个过程大约需要 5–8 分钟，您的回答将完全匿名。</p>
      <button class="btn" id="start-btn">开始</button>
    `);
    document.getElementById('start-btn').onclick = () => {
      state.screen = 'screening';
      render();
    };
  }

  // ---- shared question renderer ----
  // Builds the input HTML and wires up interaction for ANY question type.
  // Used by both renderScreening() and renderSurvey() so every type works everywhere.
  function buildQuestionInput(q){
    if(q.type === 'number'){
      return `<div class="field"><input type="number" id="q-input" placeholder="请输入数字" /></div>`;
    } else if(q.type === 'text'){
      return `<div class="field"><textarea id="q-input" placeholder="请在此输入您的回答…"></textarea></div>`;
    } else if(q.type === 'scale'){
      return `
        <div class="scale-row">${Array.from({length:q.max-q.min+1},(_,i)=>q.min+i).map(v=>
          `<button class="scale-pt" data-val="${v}">${v}</button>`).join('')}</div>
        <div class="scale-labels"><span>${q.minLabel}</span><span>${q.maxLabel}</span></div>
      `;
    } else if(q.type === 'single-choice'){
      return `<div class="choice-row">${q.options.map(opt=>
        `<button class="choice-btn single-choice-btn" data-val="${escAttr(opt)}">${opt}</button>`).join('')}</div>`;
    } else if(q.type === 'multiple-choice'){
      return `
        <p style="font-size:12px;color:var(--ink-dim);margin:0 0 10px">可多选</p>
        <div class="choice-row">${q.options.map(opt=>
          `<button class="choice-btn multi-choice-btn" data-val="${escAttr(opt)}">${opt}</button>`).join('')}</div>
      `;
    } else if(q.type === 'video-picker'){
      return `
        <div class="video-pick-list">
          ${state.feedList.map((item,i)=>{
            const m = metaFor(item);
            const initial = (m.handle.replace(/[^a-zA-Z\u4e00-\u9fff]/g,'')||'?')[0].toUpperCase();
            return `
              <div class="video-pick-card" data-val="${i}" id="vpc-${i}">
                <div class="vpc-left">
                  <div class="vpc-thumb">${initial}</div>
                  <div class="vpc-info">
                    <div class="vpc-handle">@${m.handle}</div>
                    <div class="vpc-caption">${m.caption.slice(0,40)}${m.caption.length>40?'…':''}</div>
                  </div>
                </div>
                <button class="vpc-rewatch" data-idx="${i}" type="button">重看</button>
              </div>
            `;
          }).join('')}
        </div>
        <!-- rewatch modal -->
        <div class="rewatch-modal" id="rewatch-modal">
          <div class="rewatch-inner">
            <video id="rewatch-video" playsinline controls style="width:100%;max-height:70vh;background:#000;border-radius:10px;"></video>
            <button class="rewatch-close" id="rewatch-close">✕ 关闭</button>
          </div>
        </div>
      `;
    } else if(q.type === 'audio-multiple-choice'){
      return `
        <div class="audio-block">
          <button class="audio-play-btn" id="audio-play-btn" type="button">&#9658;</button>
          <span class="audio-hint" id="audio-hint">点击播放</span>
          <audio id="q-audio" src="${escAttr(q.audioSrc)}" preload="auto"></audio>
        </div>
        <div class="choice-row">${q.options.map(opt=>
          `<button class="choice-btn" data-val="${escAttr(opt)}">${opt}</button>`).join('')}</div>
      `;
    }
    return `<p style="color:var(--accent)">Unknown question type: "${q.type}"</p>`;
  }

  // Returns true if Continue should start enabled (text/number are always enabled since
  // they're optional or validate on submit; everything else requires a tap first).
  function startEnabled(q){
    return q.type === 'text' || q.type === 'number';
  }

  // Wire up interactions after the question HTML is in the DOM.
  // Returns a getter function: call getValue() to get the current answer (or null if unanswered).
  function wireQuestionInput(q){
    let selected = null;

    if(q.type === 'audio-multiple-choice'){
      const audio   = document.getElementById('q-audio');
      const playBtn = document.getElementById('audio-play-btn');
      const hint    = document.getElementById('audio-hint');
      let playCount = 0;
      playBtn.onclick = () => { audio.currentTime = 0; audio.play().catch(()=>{}); };
      audio.onplay   = () => { playBtn.innerHTML = '&#9632;'; };
      audio.onended  = () => {
        playBtn.innerHTML = '&#9658;';
        playCount++;
        hint.textContent = `已播放 ${playCount} 次 — 点击重播`;
      };
    }

    if(q.type === 'number'){
      const inp = document.getElementById('q-input');
      inp.oninput = () => {
        document.getElementById('next-btn').disabled = inp.value.trim() === '';
      };
    } else if(q.type === 'text'){
      // always enabled
    } else if(q.type === 'multiple-choice'){
      // true multi-select — each button toggles independently
      document.querySelectorAll('.multi-choice-btn').forEach(btn=>{
        btn.onclick = () => {
          btn.classList.toggle('selected');
          const anySelected = document.querySelectorAll('.multi-choice-btn.selected').length > 0;
          document.getElementById('next-btn').disabled = !anySelected;
        };
      });
    } else {
      // single-select types: scale, single-choice, video-picker, audio-multiple-choice
      document.querySelectorAll('.scale-pt, .single-choice-btn, .choice-btn:not(.multi-choice-btn)').forEach(btn=>{
        btn.onclick = () => {
          document.querySelectorAll('.scale-pt, .single-choice-btn, .choice-btn:not(.multi-choice-btn)').forEach(b=>b.classList.remove('selected'));
          btn.classList.add('selected');
          selected = btn.dataset.val;
          document.getElementById('next-btn').disabled = false;
        };
      });
      // video-pick-card: clicking the card selects it; clicking "重看" opens modal
      document.querySelectorAll('.video-pick-card').forEach(card=>{
        card.addEventListener('click', (e)=>{
          if(e.target.closest('.vpc-rewatch')) return; // handled separately
          document.querySelectorAll('.video-pick-card').forEach(c=>c.classList.remove('selected'));
          card.classList.add('selected');
          selected = card.dataset.val;
          document.getElementById('next-btn').disabled = false;
        });
      });
      document.querySelectorAll('.vpc-rewatch').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          const idx = Number(btn.dataset.idx);
          const item = state.feedList[idx];
          if(!item) return;
          const modal = document.getElementById('rewatch-modal');
          const vid   = document.getElementById('rewatch-video');
          vid.src = item.src;
          vid.play().catch(()=>{});
          modal.classList.add('open');
        });
      });
      const modal = document.getElementById('rewatch-modal');
      const closeBtn = document.getElementById('rewatch-close');
      if(modal && closeBtn){
        closeBtn.onclick = ()=>{
          modal.classList.remove('open');
          document.getElementById('rewatch-video').pause();
        };
        modal.addEventListener('click', (e)=>{
          if(e.target === modal){
            modal.classList.remove('open');
            document.getElementById('rewatch-video').pause();
          }
        });
      }
    }

    return function getValue(){
      if(q.type === 'text')   return document.getElementById('q-input').value.trim();
      if(q.type === 'number') return document.getElementById('q-input').value.trim();
      if(q.type === 'multiple-choice'){
        const sel = Array.from(document.querySelectorAll('.multi-choice-btn.selected')).map(b=>b.dataset.val);
        return sel.length > 0 ? sel : null;
      }
      if(q.type === 'video-picker'){
        const sel = document.querySelector('.video-pick-card.selected');
        return sel ? sel.dataset.val : null;
      }
      return selected;
    };
  }

  function renderScreening(){
    const qs = CONFIG.screeningQuestions;
    const q  = qs[state.screeningIndex];
    const dots = qs.map((_,i)=>`<div class="dot ${i<=state.screeningIndex?'active':''}"></div>`).join('');

    screenWrap(`
      <div class="progress-dots">${dots}</div>
      <h1 style="font-size:22px;">${q.prompt}</h1>
      ${buildQuestionInput(q)}
      <div class="err" id="err-msg"></div>
      <button class="btn" id="next-btn" ${startEnabled(q)?'':'disabled'}>继续</button>
    `);

    const getValue = wireQuestionInput(q);

    document.getElementById('next-btn').onclick = () => {
      const val = getValue();
      if(val === null || val === ''){
        document.getElementById('err-msg').textContent = '请回答此问题。';
        return;
      }
      state.screeningAnswers[q.id] = val;
      if(state.screeningIndex < qs.length - 1){
        state.screeningIndex++;
      } else {
        buildFeed();
        state.screen = 'feedIntro';
      }
      render();
    };
  }

  function renderFeedIntro(){
    screenWrap(`
      <p class="eyebrow">即将开始</p>
      <h1>滑动浏览视频动态</h1>
      <p class="lead">向上滑动或滚动即可切换到下一个视频，就像正常刷短视频一样。滑过最后一个视频后，您将进入问卷部分。</p>
      <button class="btn" id="go-feed-btn">开始观看</button>
    `);
    document.getElementById('go-feed-btn').onclick = () => {
      state.screen = 'feed';
      render();
    };
  }

  // Video metadata keyed by filename (without path or extension).
  // Sourced from wenzhounese_video_log__1_.xlsx — place that file next to index.html.
  // Metadata is now embedded directly in each targetVideos entry in config.js.
  // metaFor reads it from the feed item's .meta field set during buildFeed.
  function metaFor(item){
    const m = item.meta || {};
    return {
      handle:   m.handle   || (item.src||'').split('/').pop().replace(/\.[^.]+$/,''),
      caption:  m.caption  || '',
      likes:    m.likes    || 0,
      comments: m.comments || 0,
      shares:   m.shares   || 0,
    };
  }

  function fmtN(n){
    if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
    if(n >= 10000)   return (n/10000).toFixed(1).replace(/\.0$/,'') + 'w';
    if(n >= 1000)    return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
    return String(n);
  }

  // Pick n random comments from the pool without repeats
  function pickComments(n){
    const pool = [...(CONFIG.commentsPool || [])];
    for(let i=pool.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]]=[pool[j],pool[i]];
    }
    return pool.slice(0, Math.min(n, pool.length));
  }

  function renderFeed(){
    const list = state.feedList;
    app.innerHTML = `
      <div id="feed-screen">
        <div class="feed-progress">
          ${list.map((_,i)=>`<div class="seg" data-i="${i}"></div>`).join('')}
        </div>
        <div class="feed-scroller" id="scroller">
          ${list.map((item,i)=>{
            const m = metaFor(item);
            const initial = (m.handle.replace(/[^a-zA-Z\u4e00-\u9fff]/g,'')||'?')[0].toUpperCase();
            const coms = pickComments(CONFIG.commentsPerVideo || 3);
            return `
            <div class="feed-item" data-i="${i}">
              <div class="backdrop" id="backdrop-${i}"></div>
              <video src="${item.src}" playsinline ${i===0?'autoplay':''} muted loop></video>

              <div class="feed-rail">
                <div class="feed-avatar">${initial}</div>
                <div class="feed-actions">
                  <div class="feed-action">
                    <div class="feed-action-icon" id="like-btn-${i}" data-stem="${item.targetId||i}">&#10084;</div>
                    <div class="feed-action-count" id="like-count-${i}">${fmtN(m.likes)}</div>
                  </div>
                  <div class="feed-action" id="comment-btn-${i}" style="cursor:pointer">
                    <div class="feed-action-icon">&#128172;</div>
                    <div class="feed-action-count">${fmtN(m.comments)}</div>
                  </div>
                  <div class="feed-action" id="share-btn-${i}" style="cursor:pointer">
                    <div class="feed-action-icon">&#10148;</div>
                    <div class="feed-action-count">${fmtN(m.shares)}</div>
                  </div>
                </div>
              </div>

              <div class="feed-meta">
                <div class="feed-handle"><span class="feed-handle-at">@${m.handle}</span></div>
                <div class="feed-caption">${m.caption}</div>
                <div class="feed-music"><span class="feed-music-note">&#9835;</span> 原声 - ${m.handle}</div>
              </div>

              <div class="comments-drawer" id="comments-${i}">
                <div class="comments-drawer-handle"></div>
                <div class="comments-drawer-title">评论 ${fmtN(m.comments)}</div>
                ${coms.map(c=>{
                  const av = c.replace(/[^a-zA-Z\u4e00-\u9fff]/g,'')[0]||'用';
                  return `<div class="comment-row">
                    <div class="comment-avatar">${av}</div>
                    <div class="comment-body">
                      <div class="comment-handle">用户${Math.floor(Math.random()*9000+1000)}</div>
                      <div class="comment-text">${c}</div>
                    </div>
                  </div>`;
                }).join('')}
              </div>

              <div class="sound-icon" id="sound-icon-${i}">&#128263;</div>
            </div>`;
          }).join('')}
        </div>
        <div class="sound-overlay" id="sound-overlay">
          <div class="sound-overlay-inner">
            <div class="sound-overlay-icon">&#128266;</div>
            <div>点击任意位置开启声音</div>
          </div>
        </div>
        <div class="share-toast" id="share-toast">🔗 链接已复制！</div>
        <button class="feed-back-btn" id="feed-back-btn">◀</button>
        <div class="volume-bar">
          <span class="volume-icon">🔊</span>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="150" value="100">
        </div>
        <button class="feed-continue" id="continue-btn">进入问卷 ›</button>
      </div>
    `;

    const scroller = document.getElementById('scroller');
    const items = Array.from(document.querySelectorAll('.feed-item'));
    const segs = Array.from(document.querySelectorAll('.seg'));
    const soundOverlay = document.getElementById('sound-overlay');
    const watched = new Set();
    let soundEnabled = false;
    let currentIndex = 0;

    function markDone(i){
      watched.add(i);
      if(segs[i]) segs[i].classList.add('done');
    }

    function updateSoundIcons(){
      items.forEach((it,i)=>{
        const icon = document.getElementById('sound-icon-' + i);
        if(!icon) return;
        icon.innerHTML = soundEnabled ? '&#128266;' : '&#128263;';
      });
    }

    // Enable sound globally on first tap anywhere in the feed (browsers block
    // autoplay-with-sound, so we unmute in direct response to a user gesture).
    function enableSound(){
      if(soundEnabled) return;
      soundEnabled = true;
      items.forEach(it=>{ it.querySelector('video').muted = false; });
      soundOverlay.classList.add('hidden');
      updateSoundIcons();
    }
    soundOverlay.addEventListener('click', enableSound);

    // play/pause based on visibility, track watch progress, track current index
    const observer = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        const vid = entry.target.querySelector('video');
        const idx = Number(entry.target.dataset.i);
        if(entry.isIntersecting && entry.intersectionRatio > 0.6){
          vid.muted = !soundEnabled;
          vid.play().catch(()=>{});
          currentIndex = idx;
          if(idx === list.length - 1){
            document.getElementById('continue-btn').classList.add('show');
          }
        } else {
          vid.pause();
        }
      });
    }, { threshold:[0,0.6,1] });
    items.forEach(it=>observer.observe(it));

    // Capture a blurred backdrop frame from each video once it has data,
    // so vertical/non-fullscreen videos don't leave bare black bars.
    items.forEach((it,i)=>{
      const vid = it.querySelector('video');
      const backdrop = document.getElementById('backdrop-' + i);
      vid.addEventListener('loadeddata', function grabFrame(){
        try{
          const canvas = document.createElement('canvas');
          canvas.width = 80;
          canvas.height = 80;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
          backdrop.style.backgroundImage = `url(${canvas.toDataURL('image/jpeg', 0.5)})`;
        }catch(e){ /* canvas may fail on cross-origin sources; backdrop just stays black */ }
      }, { once:true });
    });

    // mark a video watched once it reaches ~70% playthrough or ends
    items.forEach((it,i)=>{
      const vid = it.querySelector('video');
      vid.addEventListener('timeupdate', ()=>{
        if(vid.duration && vid.currentTime / vid.duration > 0.7) markDone(i);
      });
      vid.addEventListener('ended', ()=> markDone(i));
      it.addEventListener('click', (e)=>{
        if(!soundEnabled){ enableSound(); return; }
        vid.muted = !vid.muted;
        soundEnabled = !vid.muted ? true : soundEnabled;
        document.getElementById('sound-icon-' + i).innerHTML = vid.muted ? '&#128263;' : '&#128266;';
      });
    });

    // Like button — toggle liked state
    items.forEach((it, i) => {
      const likeBtn   = document.getElementById('like-btn-' + i);
      const likeCount = document.getElementById('like-count-' + i);
      if(!likeBtn) return;
      const stem = list[i].targetId || String(i);
      const baseLikes = metaFor(list[i]).likes;

      likeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isLiked = state.likedVideos.has(stem);
        if(isLiked){
          state.likedVideos.delete(stem);
          likeBtn.style.color = '';
          likeBtn.classList.remove('liked');
          likeCount.textContent = fmtN(baseLikes);
        } else {
          state.likedVideos.add(stem);
          likeBtn.style.color = '#ff3b5c';
          likeBtn.classList.remove('liked');
          void likeBtn.offsetWidth;
          likeBtn.classList.add('liked');
          likeCount.textContent = fmtN(baseLikes + 1);
        }
      });
    });

    // Comments button — toggle drawer open/closed
    const shareToast = document.getElementById('share-toast');
    items.forEach((it, i) => {
      const commentBtn = document.getElementById('comment-btn-' + i);
      const drawer     = document.getElementById('comments-' + i);
      if(!commentBtn || !drawer) return;
      commentBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = drawer.classList.contains('open');
        // close all other drawers first
        document.querySelectorAll('.comments-drawer').forEach(d => d.classList.remove('open'));
        if(!isOpen) drawer.classList.add('open');
      });
      // tapping the video body closes the drawer
      it.addEventListener('click', () => { drawer.classList.remove('open'); });
    });

    // Volume slider — controls all videos 0–150%
    const volSlider = document.getElementById('volume-slider');
    volSlider.addEventListener('input', () => {
      const vol = Math.min(1.5, volSlider.value / 100);
      items.forEach(it => {
        const v = it.querySelector('video');
        // browsers cap volume at 1.0 natively; for >100% we'd need WebAudio — cap at 1.0
        v.volume = Math.min(1.0, vol);
      });
    });
    volSlider.addEventListener('click', e => e.stopPropagation());

    // Back button — scroll to previous video
    const backBtn = document.getElementById('feed-back-btn');
    backBtn.addEventListener('click', e => {
      e.stopPropagation();
      if(currentIndex > 0){
        items[currentIndex - 1].scrollIntoView({ behavior:'smooth' });
      }
    });
    // show back button only when not on first video
    const origObserverCb = (entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting && entry.intersectionRatio > 0.6){
          backBtn.classList.toggle('show', currentIndex > 0);
        }
      });
    };
    // update back btn whenever currentIndex changes (piggyback on existing observer)
    const backBtnInterval = setInterval(() => {
      backBtn.classList.toggle('show', currentIndex > 0);
    }, 300);
    let toastTimer = null;
    items.forEach((it, i) => {
      const shareBtn = document.getElementById('share-btn-' + i);
      if(!shareBtn) return;
      shareBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const url = CONFIG.shareUrl || window.location.href;
        navigator.clipboard.writeText(url).catch(() => {
          // fallback for browsers without clipboard API
          const ta = document.createElement('textarea');
          ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta);
        });
        shareToast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => shareToast.classList.remove('show'), 2200);
      });
    });

    // Scrolling/swiping past the final video goes straight to the survey —
    // no need to tap a continue button.
    let touchStartY = null;
    let advanced = false;
    function goToSurvey(){
      if(advanced) return;
      advanced = true;
      clearInterval(backBtnInterval);
      state.screen = 'survey';
      state.surveySection = 0;
      state.surveyQIndex = 0;
      render();
    }
    scroller.addEventListener('wheel', (e)=>{
      const atLast = currentIndex === list.length - 1;
      if(atLast && e.deltaY > 0){ goToSurvey(); }
    }, { passive:true });
    scroller.addEventListener('touchstart', (e)=>{
      touchStartY = e.touches[0].clientY;
    }, { passive:true });
    scroller.addEventListener('touchend', (e)=>{
      const atLast = currentIndex === list.length - 1;
      if(atLast && touchStartY !== null){
        const dy = touchStartY - e.changedTouches[0].clientY;
        if(dy > 40){ goToSurvey(); } // swiped up past the last video
      }
    }, { passive:true });

    document.getElementById('continue-btn').onclick = goToSurvey;
  }

  // ---- survey ----
  function surveySections(){
    const targetIds  = state.studyTargetIds || [state.targetMeta.id];
    const audioQs    = targetIds.flatMap(id => (CONFIG.targetAudioQuestions && CONFIG.targetAudioQuestions[id]) || []);
    const isWenzhou  = state.screeningAnswers['wenzhounese_identity'] === '是';
    const deepDiveQs = isWenzhou ? (CONFIG.wenzhouneseQuestions || []) : (CONFIG.nonWenzhouneseQuestions || []);
    const deepTitle  = isWenzhou ? '关于您与温州话的关系' : '关于您对温州话的印象';
    return [
      { key:'general',   title:'关于这组视频',    questions: CONFIG.generalQuestions },
      { key:'target',    title:'关于其中的视频',   questions: [...CONFIG.targetQuestions, ...audioQs] },
      { key:'deepdive',  title: deepTitle,         questions: deepDiveQs },
      { key:'background',title:'关于您自己',       questions: CONFIG.backgroundQuestions },
    ];
  }

  function renderSurvey(){
    const sections = surveySections();
    const sec = sections[state.surveySection];
    const q = sec.questions[state.surveyQIndex];
    const isFirstOfSection = state.surveyQIndex === 0;

    let inputHtml = buildQuestionInput(q);

    screenWrap(`
      ${isFirstOfSection ? `<p class="section-title">${sec.title}</p>` : ''}
      <h1 style="font-size:21px;">${q.prompt}</h1>
      ${inputHtml}
      <div class="err" id="err-msg"></div>
      <button class="btn" id="next-btn" ${startEnabled(q)?'':'disabled'}>继续</button>
    `);

    const getValue = wireQuestionInput(q);

    document.getElementById('next-btn').onclick = () => {
      const val = getValue();
      if(val === null || val === ''){
        // text is optional, everything else requires an answer
        if(q.type !== 'text'){
          document.getElementById('err-msg').textContent = '请回答此问题。';
          return;
        }
      }
      if(q.type === 'audio-multiple-choice' && q.correctAnswer){
        state.surveyAnswers[q.id] = { answer: val, correct: val === q.correctAnswer };
      } else {
        state.surveyAnswers[q.id] = val ?? '';
      }

      // advance within section
      if(state.surveyQIndex < sec.questions.length - 1){
        state.surveyQIndex++;
        render();
        return;
      }
      // advance to next section
      if(state.surveySection < sections.length - 1){
        state.surveySection++;
        state.surveyQIndex = 0;
        render();
        return;
      }
      // finished — save and show done screen
      state.screen = 'done';
      saveResponse();
      render();
    };
  }

  function renderDone(){
    screenWrap(`
      <div class="done-screen">
        <h1>感谢您的参与！</h1>
        <p class="lead">您的回答已生成为一个文件。请点击下方按钮下载，然后将文件通过微信或邮件发送给研究人员。</p>
        <a class="btn" id="download-btn" href="${state.downloadUrl}" download="${state.downloadFilename}">
          ⬇ 下载我的回答
        </a>
        <p class="lead" style="margin-top:24px; font-size:13px; color:var(--ink-dim);">
          文件名：${state.downloadFilename}<br>
          下载后请将文件发送至：<a href="mailto:supersmarteason0416@outlook.com" style="color:var(--accent)">supersmarteason0416@outlook.com</a><br>
          或通过微信直接发送给研究人员。请勿修改文件内容，直接发送即可。
        </p>
      </div>
    `);
  }

  render();
})();
</script>
